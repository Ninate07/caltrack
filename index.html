<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CalTrack</title>
<meta name="description" content="CalTrack : journal de calories par repas, scan de codes-barres, recettes et suivi du poids.">
<meta name="theme-color" content="#F4EEDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CalTrack">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: colonne unique type carnet, anneau de calories en tête, repas en sections, barre d'onglets fixe en bas. Thème clair unique, choisi volontairement : pistache et beige, doux. */
:root{
  --bg:#F4EEDF; --surface:#FFFCF4; --sunk:#ECE4CF; --ink:#33402A; --muted:#777B63; --line:#E2D9C2;
  --accent:#5E8136; --accent-ink:#FFFFFF; --accent-soft:#E2ECCB; --pista:#A6C66E; --pista-l:#C9DE9C;
  --fur:#C99D72; --fur-d:#9A7149; --muzzle:#F4E4CB; --nose:#5E4030; --belly:#FFF9EA; --cheek:#F0A79B;
  --prot:#C76E88; --gluc:#C9952F; --lip:#5F92BE; --over:#DB7F4E; --water:#5FAFC6;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --r:18px; color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{background:linear-gradient(180deg,#E6EDCF 0,var(--bg) 300px) no-repeat,var(--bg)}
.card{box-shadow:0 1px 2px rgba(90,80,40,.06),0 4px 14px rgba(90,80,40,.06)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:0 16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
main{max-width:540px;margin:0 auto;padding-block:14px 8px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar h1{font-size:22px;text-align:center;flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.summary{display:grid;grid-template-columns:136px 1fr;gap:14px;align-items:center}
.mascot{width:136px;height:auto;display:block;overflow:visible}
.mascot .bob{animation:bob 3.2s ease-in-out infinite}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.mascot .wave{animation:wave 2.6s linear infinite}
.mascot .fill{transition:transform 1.6s cubic-bezier(.3,.7,.3,1)}
.mascot .arm-r{transform-box:fill-box;transform-origin:0% 0%;animation:wavearm 3.2s ease-in-out infinite}
.mascot.jump .bob{animation:hop .55s ease-in-out 4}
.mascot .drop{animation:drip 2.2s ease-in infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes wave{to{transform:translateX(-32px)}}
@keyframes wavearm{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-18deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-14deg)}}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}
.big-left{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bubble{position:relative;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:7px 11px;font-size:13.5px;line-height:1.3;align-self:flex-start}
.bubble::before{content:"";position:absolute;left:-6px;top:12px;border:6px solid transparent;border-left:0;border-right-color:var(--accent-soft)}
.wrow{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;margin-top:8px}
.wrow .mascot{width:96px}
@media (prefers-reduced-motion:reduce){.mascot *{animation:none!important;transition:none!important}}
.ring text{font-family:var(--f-display)}
.sumstats{display:flex;flex-direction:column;gap:10px;min-width:0}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.macro .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.macro .bar i{display:block;height:100%;border-radius:3px}
.macro small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.macro span{font-size:13px;font-weight:700}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:14px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.meal-h h2{font-size:17px}
.meal-h .kc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.plus{width:36px;height:36px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1;display:grid;place-items:center}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px}
.entry:last-child{border-bottom:0}
.entry .nm{flex:1;min-width:0}
.entry .nm b{display:block;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .nm small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.entry .k{font-variant-numeric:tabular-nums;font-weight:700}
.empty{padding:12px 16px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.glass{width:34px;height:42px;border:2px solid var(--water);border-radius:4px 4px 8px 8px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass.on{background:var(--water)}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{display:flex;max-width:540px;width:100%}
.tab{flex:1;background:none;border:0;padding:8px 4px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

[hidden]{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(51,64,42,.35);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-h{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--over)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.flist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.frow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .pick{flex:1;min-width:0;text-align:left;background:none;border:0;padding:10px 14px}
.frow .pick b{display:block;font-weight:400}
.frow .pick small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.star{background:none;border:0;padding:10px 14px;font-size:20px;color:var(--muted)}
.star.on{color:var(--gluc)}
.grp{margin:4px 0 -4px}
.live{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.live div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.live b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.live small{font-size:12px;color:var(--muted)}
.ai-item{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ai-item input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.ai-item .nm{flex:1;min-width:0}
.ai-item .nm small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ai-item input[type=number]{width:84px;flex:none;padding:6px 8px}
.filebtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--muted);border-radius:12px;padding:12px;font-weight:700;cursor:pointer}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.prev{max-height:180px;border-radius:12px;object-fit:cover;width:100%}
.note{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat3 b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat3 small{font-size:12px;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-size:14px}
.wlist div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:2px 8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:1px;margin-left:4px}
.badge.etiquette,.badge.recette,.badge.ciqual{color:var(--accent)}
.badge.ia{color:var(--gluc)}
.warn{background:var(--sunk);border-left:3px solid var(--gluc);border-radius:8px;padding:8px 12px;font-size:14px;margin:0}
.okline{font-size:13px;color:var(--accent);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow .btn{flex:1;min-width:140px}
.rcard{display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rhead h2{font-size:18px;min-width:0}
.big{font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.ing{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px 12px}
.ing .nm{flex:1;min-width:0}.ing .nm b{font-weight:400;display:block}
.ing .nm small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.ing input{width:80px;flex:none;padding:6px 8px}
.totbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
@media (max-width:380px){.summary{grid-template-columns:112px 1fr}.mascot{width:112px}.big-left{font-size:26px}.live b{font-size:16px}}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--accent);letter-spacing:.01em}
.camwrap{position:relative;border-radius:14px;overflow:hidden;background:#1d2216;aspect-ratio:4/3;width:100%}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:8%;right:8%;top:28%;bottom:28%;border:3px solid #FFFFFF;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.28)}
.aim::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--over);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.attrib{font-size:12px;color:var(--muted);margin:0}
.attrib a,.note a{color:var(--accent)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg.lang{padding:2px;gap:2px;flex:none}
.seg.lang button{padding:5px 11px;font-size:13px}
.anlist{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.an{display:grid;grid-template-columns:12px 1fr;gap:10px;align-items:start}
.an p{margin:0}.an .note{margin-top:3px}
.an .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.an.warn .dot{background:var(--over)}.an.info .dot{background:var(--gluc)}
.motd{margin:-4px 0 0;text-align:center;font-size:14px;color:var(--muted);font-style:italic}
.motd b{font-style:normal;color:var(--accent);font-weight:700}
</style>
</head>
<body>

<main id="main"><p class="muted" data-t="loading">Chargement de CalTrack…</p></main>

<nav class="tabs" aria-label="Sections"><div>
  <button class="tab" data-act="tab" data-v="journal" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></svg><span data-t="tabJournal">Journal</span></button>
  <button class="tab" data-act="tab" data-v="recettes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 13h12v3a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M4 13h16M9 9c0-2 2-2 2-4M13 9c0-2 2-2 2-4"/></svg><span data-t="tabRecipes">Recettes</span></button>
  <button class="tab" data-act="tab" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg><span data-t="tabStats">Suivi</span></button>
  <button class="tab" data-act="tab" data-v="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="tabProfile">Profil</span></button>
</div></nav>
<div id="ov" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

<script src="ciqual-2025.js"></script>
<script>
/* ---------- Aliments courants : table Ciqual 2025 (Anses), valeurs reprises sans modification ---------- */
/* "-" = non renseigné : jamais assimilé à zéro dans l'affichage ; "traces" et "< x" sont affichés tels quels et comptés 0 dans les totaux */
const cqNum=v=>{v=String(v==null?'-':v).trim();if(v==='-'||v==='')return null;if(v==='traces'||v[0]==='<')return 0;const n=parseFloat(v.replace(',','.'));return isNaN(n)?null:n};
const FOODS=(typeof CIQUAL!=='undefined'?CIQUAL:[]).map(r=>{const gal=cqNum(r[8]),lac=cqNum(r[9]);return{id:'q'+r[0],ciq:r[0],n:r[1],kc:cqNum(r[3])||0,pr:cqNum(r[4])??0,gl:cqNum(r[5])??0,li:cqNum(r[6])??0,
  su:cqNum(r[7]),lg:gal!=null&&lac!=null?gal+lac:null,fi:cqNum(r[10]),ags:cqNum(r[11]),sel:cqNum(r[12]),raw:{kc:r[3],pr:r[4],gl:r[5],li:r[6],su:r[7],fi:r[10],ags:r[11],sel:r[12]},cat:CIQUAL_GROUPS[r[2]],src:'ciqual',pl:'',pg:0}});
FOODS.forEach(f=>f.nn=norm0(f.n));
function norm0(s){return String(s).toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'')}

/* ---------- Langue : français / anglais ---------- */
const S={fr:{
 motTitle:'Le mot du jour',
 cvAuto:'proposé automatiquement',
 sugarsG:'dont sucres (g)',satG:'dont acides gras saturés (g)',fibreG:'Fibres (g)',saltG:'Sel (g)',
 anTitle:'Analyse du jour',anWeek:'Moyenne des 7 derniers jours ({n} jour(s) notés)',anPartial:'Journée encore incomplète : les excès sont signalés, mais pas les manques.',
 anSaltHi:'Sel : {v} g{p}, au-dessus du repère de moins de 5 g par jour (OMS).',anSaltOk:'Sel : {v} g{p}, sous le repère de 5 g par jour (OMS).',
 anSugHi:'Sucres : {v} g{p}, au-dessus du repère de 100 g par jour au maximum (Anses, hors sucres du lait).',anSugOk:'Sucres : {v} g{p}, sous le repère de 100 g par jour (Anses, hors sucres du lait).',
 anFibLo:'Fibres : {v} g{p}, en dessous du repère d\'au moins 30 g par jour (Anses).',anFibOk:'Fibres : {v} g{p}, repère d\'au moins 30 g par jour atteint (Anses).',
 anAgsHi:'Acides gras saturés : {v} % des calories{p}, au-dessus du repère de 12 % au maximum (Anses).',anAgsOk:'Acides gras saturés : {v} % des calories{p}, sous le repère de 12 % (Anses).',
 anKcalHi:'Calories : {v} kcal au-dessus de ton objectif.',perDay:' par jour en moyenne',
 anTop:'Plus gros apports : {l}.',anTip:'Réduire la portion de {f} ou la remplacer est ce qui changerait le plus le total.',anFibEx:'Exemples riches en fibres (Ciqual, pour 100 g) : {l}.',
 anMissing:'Valeur inconnue pour {n} aliment(s) : le total est sans doute un peu sous-estimé.',anLactose:'Pour {n} aliment(s), le sucre du lait n\'a pas pu être déduit : le total peut être un peu surestimé.',
 anSources:'Repères pour adultes : OMS, fiche « Réduction de la consommation de sel » (2026) ; Anses, sucres (2016), fibres (2016) et acides gras (2010). Ces informations ne remplacent pas l\'avis d\'un professionnel de santé.',
 anEmpty:'Note tes repas pour voir l\'analyse.',

/* Contrôle de cohérence : 4 kcal/g protéines et glucides, 9 kcal/g lipides */
function coherence(kc,pr,gl,li){const c=4*pr+4*gl+9*li;if(!(kc>0)||!(c>0))return null;const d=kc-c;
  if(Math.abs(d)<=Math.max(15,kc*0.15))return{ok:true,c};return{ok:false,c,more:d>0}}
function eanOk(c){if(!/^(\d{8}|\d{12}|\d{13})$/.test(c))return false;const d=c.split('').map(Number),chk=d.pop();let s=0;d.reverse().forEach((n,i)=>s+=n*(i%2?1:3));return (10-s%10)%10===chk}

function energy(p=P.profile){const bmr=10*p.poids+6.25*p.taille-5*p.age+(p.sexe==='H'?5:-161);return{bmr:Math.round(bmr),tdee:Math.round(bmr*p.activite)}}
function targets(p=P.profile){const{tdee}=energy(p);let kcal=+p.kcalPerso>0?+p.kcalPerso:tdee*({perte:0.85,maintien:1,prise:1.1}[p.objectif]||1);
  kcal=Math.max(kcal,p.sexe==='H'?1500:1200);kcal=Math.round(kcal/10)*10;
  const pr=Math.round(Math.min(p.poids*1.8,kcal*0.3/4)),li=Math.round(kcal*0.3/9),gl=Math.max(0,Math.round((kcal-pr*4-li*9)/4));return{kcal,pr,gl,li}}
const tot=e=>({kc:e.b.kc*e.g/100,pr:e.b.pr*e.g/100,gl:e.b.gl*e.g/100,li:e.b.li*e.g/100});
function sum(list){return list.reduce((a,e)=>{const x=tot(e);a.kc+=x.kc;a.pr+=x.pr;a.gl+=x.gl;a.li+=x.li;return a},{kc:0,pr:0,gl:0,li:0})}
function recipeTotals(r){const x=r.ings.reduce((a,i)=>{a.kc+=i.b.kc*i.g/100;a.pr+=i.b.pr*i.g/100;a.gl+=i.b.gl*i.g/100;a.li+=i.b.li*i.g/100;a.raw+=+i.g||0;return a},{kc:0,pr:0,gl:0,li:0,raw:0});
  x.W=+r.cooked>0?+r.cooked:x.raw;x.parts=Math.max(1,+r.parts||1);return x}
function recipeFood(r){const x=recipeTotals(r),W=x.W||1;
  return{id:r.id,n:r.n||t('unnamedRecipe'),kc:x.kc/W*100,pr:x.pr/W*100,gl:x.gl/W*100,li:x.li/W*100,pl:S.fr.onePart,plEn:S.en.onePart,pg:W/x.parts,cat:'Mes recettes',src:'recette',noCooked:!(+r.cooked>0),...Object.fromEntries(XK.map(k=>[k,r.ings.length&&r.ings.every(i=>i.b[k]!=null)?r.ings.reduce((a,i)=>a+i.b[k]*i.g/100,0)/W*100:null]))}}

const REF={sel:5,su:100,fi:30,ags:12};
const FIB_EX=["Haricot rouge, bouilli/cuit à l'eau","Lentille verte, bouillie/cuite à l'eau","Pois chiche, bouilli/cuit à l'eau","Artichaut, cuit","Pain complet ou intégral (à la farine T150)","Framboise, crue"];
function nutr(entries){const o={kc:0,n:entries.length,su:0,fi:0,ags:0,sel:0,miss:{su:0,fi:0,ags:0,sel:0},noLg:0,c:{kc:{},su:{},fi:{},ags:{},sel:{}}};
  const add=(k,name,q)=>{o.c[k][name]=(o.c[k][name]||0)+q};
  entries.forEach(e=>{const g=e.g/100,nm=ename(e),b=e.b;o.kc+=b.kc*g;add('kc',nm,b.kc*g);
    ['fi','ags','sel'].forEach(k=>{if(b[k]==null){o.miss[k]++;return}o[k]+=b[k]*g;add(k,nm,b[k]*g)});
    if(b.su==null)o.miss.su++;else{const v=Math.max(0,b.su-(b.lg||0))*g;if(b.lg==null&&b.su>0&&(e.src!=='ciqual'||/laitier|fromage|glace/i.test((BASE[e.fid]||{}).cat||'')))o.noLg++;o.su+=v;add('su',nm,v)}});
  return o}
function topList(map,unit,dec){return Object.entries(map).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,v])=>`${esc(n)}${LANG==='fr'?' : ':': '}${dec?f1(v):nf(v)} ${unit}`)}
function anLine(level,txt,extra){return`<div class="an ${level}"><span class="dot" aria-hidden="true"></span><div><p>${txt}</p>${extra||''}</div></div>`}
function analysisHTML(entries,T,nd,week){if(!entries.length)return'';const o=nutr(entries),d=x=>x/nd,p=week?t('perDay'):'',complete=d(o.kc)>=T.kcal*0.6,out=[];
  const miss=k=>o.miss[k]?`<p class="note">${t('anMissing',{n:o.miss[k]})}</p>`:'';
  const top=(k,unit,dec)=>{const l=topList(o.c[k],unit,dec);return l.length?`<p class="note">${t('anTop',{l:l.join(' · ')})}</p>`:''};
  let tipped=false;const tip=k=>{if(tipped)return'';tipped=true;const e=Object.entries(o.c[k]).sort((a,b)=>b[1]-a[1])[0];return e?`<p class="note">${t('anTip',{f:esc(e[0])})}</p>`:''};
  if(!week&&o.kc>T.kcal*1.05)out.push(anLine('warn',t('anKcalHi',{v:nf(o.kc-T.kcal)}),top('kc','kcal')+tip('kc')));

/* Version cuite proposée automatiquement : même groupe Ciqual, même nom de base, le plus de mots communs */
const STOP=/^(cru|crue|crus|crues|sec|seche|seches|secs|de|du|des|la|le|les|a|l|d|et|ou|en|au|aux)$/;
const COOKW=/\b(cuit|cuite|cuits|cuites|bouilli|bouillie|bouillis|bouillies|vapeur|grille|grillee|grilles|grillees|roti|rotie|rotis|roties|poele|poelee|poeles|poelees|braise|braisee)\b/;
function autoCooked(f){if(!f||f.src!=='ciqual')return null;const tok=x=>norm(x).split(/[\s,()\/'.:-]+/).filter(w=>w&&!STOP.test(w));
  const base=norm(f.n.split(',')[0]).trim(),ft=new Set(tok(f.n));if(COOKW.test(f.nn))return null;let best=null,bs=-1e9;
  const first=base.split(' ')[0];
  for(const c of FOODS){if(c===f)continue;const n=c.nn;if(!COOKW.test(n))continue;const sameBase=n.startsWith(base+',')||n.startsWith(base+' ');if(!sameBase&&!(c.cat===f.cat&&n.startsWith(first+' ')))continue;
    const ct=tok(c.n);let sc=ct.filter(w=>ft.has(w)).length*10-ct.filter(w=>!ft.has(w)&&!COOKW.test(w)).length*3;if(sameBase)sc+=20;if(n.startsWith(base+','))sc+=5;if(c.cat===f.cat)sc+=5;if(/sans sel ajoute/.test(n))sc+=2;if(sc>bs){bs=sc;best=c}}
  return best}

async function offGet(url){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),12000);
  try{const r=await fetch(url,{signal:ctl.signal,headers:{Accept:'application/json'}});
    if(r.status===404)return null;if(r.status===429)throw{msg:t('offTooMany')};

const offName=p=>String((LANG==='en'?(p.product_name_en||p.product_name||p.product_name_fr):(p.product_name_fr||p.product_name||p.product_name_en))||'').trim();
function offToFood(p){if(!p)return null;const n=p.nutriments||{},num=v=>v===undefined||v===null||v===''||isNaN(+v)?null:+v;
  let kc=num(n['energy-kcal_100g']);if(kc===null&&num(n['energy_100g'])!==null)kc=num(n['energy_100g'])/4.184;
  const name=offName(p),brand=String(p.brands||'').split(',')[0].trim();
  if(kc===null||!name)return null;const pg=num(p.serving_quantity)||0,ss=p.serving_size?String(p.serving_size).slice(0,24):'';
  return{id:'o'+p.code,code:String(p.code),n:brand&&!norm(name).includes(norm(brand))?`${name} (${brand})`:name,kc:r1(kc),pr:r1(num(n.proteins_100g)||0),gl:r1(num(n.carbohydrates_100g)||0),li:r1(num(n.fat_100g)||0),su:num(n.sugars_100g),lg:null,fi:num(n.fiber_100g),ags:num(n['saturated-fat_100g']),sel:num(n.salt_100g),
    pg,pl:pg?(ss?S.fr.servingOf.replace('{s}',ss):S.fr.serving):'',plEn:pg?(ss?S.en.servingOf.replace('{s}',ss):S.en.serving):'',cat:'Mes produits',src:'off'}}
async function offProduct(code){const j=await offGet(`${OFF}/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_FIELDS}`);
  if(!j||j.status!==1||!j.product)return{none:true};const f=offToFood(j.product);

let camStream=null,camTimer=null,camGen=0;
function zxReader(){if(!window.ZXing)return null;const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  const r=new Z.MultiFormatReader();r.setHints(h);return r}
function zxDecode(reader,canvas){try{const Z=window.ZXing;return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)))).getText()}catch(e){return null}}
async function startCam(){const gen=++camGen,v=$('#camv');if(!v)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){A.cam=false;A.scanMsg='camNone';renderSheet();return}
  let st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false})}
  catch(e){if(gen!==camGen)return;A.cam=false;A.scanMsg=e&&e.name==='NotAllowedError'?'camDenied':'camFail';renderSheet();return}
  if(gen!==camGen){st.getTracks().forEach(x=>x.stop());return}
  camStream=st;v.srcObject=st;try{await v.play()}catch(e){}
  let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']})}catch(e){det=null}
  const reader=zxReader(),c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});let n=0;
  const tick=async()=>{if(gen!==camGen||!camStream)return;let code=null;
    if(v.readyState>=2&&v.videoWidth){
      if(det){try{const r=await det.detect(v);if(r&&r[0])code=r[0].rawValue}catch(e){det=null}}
      if(!code&&reader){const W=v.videoWidth,H=v.videoHeight,full=n++%3===2,cw=full?W:W*.9,ch=full?H:H*.6,sx=(W-cw)/2,sy=(H-ch)/2,sc=Math.min(1,900/cw);
        c.width=Math.round(cw*sc);c.height=Math.round(ch*sc);x.drawImage(v,sx,sy,cw,ch,0,0,c.width,c.height);code=zxDecode(reader,c)}}
    if(gen!==camGen)return;
    if(code&&eanOk(code)){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}A.cam=false;stopCam();lookupCode(code);return}
    camTimer=setTimeout(tick,180)};tick()}
function stopCam(){camGen++;clearTimeout(camTimer);if(camStream){camStream.getTracks().forEach(x=>x.stop());camStream=null}}

async function decodeBarcode(blob){
  let img;try{img=await createImageBitmap(blob)}catch(e){return null}
  if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),r=await det.detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
  const reader=zxReader();if(reader){
    for(const max of [1200,1800,800])for(const rot of [0,90]){
      const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');
      c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext('2d');if(rot){x.translate(h,0);x.rotate(Math.PI/2)}x.drawImage(img,0,0,w,h);
      const r=zxDecode(reader,c);if(r)return r}}
  return null}
async function scanFile(file){A.scanBusy=true;A.busyKey='reading';A.scanMsg='';renderSheet();
  const code=await decodeBarcode(file);if(!A)return;A.scanBusy=false;

async function lookupCode(code){A.code=code;A.cam=false;

  let res=null,err='';try{res=await offProduct(code)}catch(e){err=e.msg||''}
  if(!A||A.code!==code)return;A.scanBusy=false;
  if(res&&res.food){OFFMEM[res.food.id]=res.food;keepOff(res.food);A.food=res.food;A.view='detail';renderSheet();toast(t('found'));return}
  A.view='create';A.pre={code,n:(res&&res.name)||'',kc:'',pr:'',gl:'',li:'',pl:'',pg:''};A.newCode=true;
  A.newWhy=err?err+t('manualMeanwhile'):(res&&res.name?t('offIncomplete'):t('offMissing'));renderSheet()}

   <label class="f">${t('carbsG')}<input id="cG" type="number" inputmode="decimal" value="${val('gl')}"></label><label class="f">${t('fatG')}<input id="cL" type="number" inputmode="decimal" value="${val('li')}"></label>
   <label class="f">${t('sugarsG')}<input id="cSu" type="number" inputmode="decimal" placeholder="${t('optional')}" value="${val('su')}"></label><label class="f">${t('satG')}<input id="cAgs" type="number" inputmode="decimal" placeholder="${t('optional')}" value="${val('ags')}"></label>
   <label class="f">${t('fibreG')}<input id="cFi" type="number" inputmode="decimal" placeholder="${t('optional')}" value="${val('fi')}"></label><label class="f">${t('saltG')}<input id="cSel" type="number" inputmode="decimal" placeholder="${t('optional')}" value="${val('sel')}"></label>
   <label class="f">${t('portionName')}<input id="cPl" placeholder="${t('portionPh')}" value="${val('pl')}"></label><label class="f">${t('portionG')}<input id="cPg" type="number" inputmode="decimal" value="${val('pg')}"></label></div>
   <p class="note" style="margin:0">${t('labelTip')}</p>
   <div id="chk"></div>
   <button class="btn" data-act="createSave">${t('saveProduct')}</button>`}
function chkUpd(){const el=$('#chk');if(!el)return;const g=id=>parseFloat($(id).value);const kc=g('#cK'),pr=g('#cP')||0,gl=g('#cG')||0,li=g('#cL')||0;
  const r=coherence(kc,pr,gl,li);
  el.innerHTML=!r?'':r.ok?`<p class="okline">${t('chkOk',{c:nf(r.c),k:nf(kc)})}</p>`
   :Math.abs(kc/4.184-r.c)<=r.c*0.15?`<p class="warn">${t('chkKj',{k:nf(kc),c:nf(kc/4.184)})}</p>`
   :`<p class="warn">${t('chkBad',{c:nf(r.c),k:nf(kc)})}${r.more&&kc<=r.c*1.3?t('chkFibre'):t('chkWrong')}</p>`}
function readCreateForm(){const g=id=>$(id).value;A.pre={...(A.pre||{}),n:g('#cN'),kc:g('#cK'),pr:g('#cP'),gl:g('#cG'),li:g('#cL'),su:g('#cSu'),ags:g('#cAgs'),fi:g('#cFi'),sel:g('#cSel'),pl:g('#cPl'),pg:g('#cPg')}}

/* ---------- Éditeur de recette ---------- */
function totHTML(r){const x=recipeTotals(r),pp=k=>x[k]/x.parts;
  return`<div class="row-h"><span class="lbl">${t('perPartN',{n:x.parts})}</span><span class="big">${nf(pp('kc'))}<small> kcal</small></span></div>
   <p class="note num" style="margin:0">${t('macrosLine',{p:f1(pp('pr')),g:f1(pp('gl')),l:f1(pp('li'))})}</p>
   <p class="note num" style="margin:0">${t('dishTotal',{k:nf(x.kc),w:nf(x.W),t:+r.cooked>0?t('cookedW'):t('rawW'),k100:nf(x.W?x.kc/x.W*100:0),wp:nf(x.W/x.parts)})}</p>`}
function ingHTML(x,i){const nm=ename(x);return`<div class="ing"><div class="nm"><b>${esc(nm)} ${badge(x.src)}</b><small data-ik="${i}">${nf(x.b.kc*x.g/100)} kcal</small></div>
  <input type="number" inputmode="decimal" data-rig="${i}" value="${r1(x.g)}" aria-label="${esc(t('grams',{n:nm}))}"><span class="note">g</span><button class="x" data-act="rDelIng" data-i="${i}" aria-label="${esc(t('remove',{n:nm}))}">×</button></div>`}
function renderRecipeSheet(){const r=A.rec,v=A.rview;
  if(v==='pick'){sheetShell(t('addIng'),`<button class="link" data-act="rView" data-v="edit" style="align-self:flex-start">${t('backRecipe')}</button>
     <input id="q" type="search" placeholder="${t('searchIng')}" value="${esc(A.q)}" autocomplete="off" enterkeyhint="search"><div id="flist">${foodListHTML('rPick',r.id)}</div>`);return}
  if(v==='qty'){const f=A.food;sheetShell(esc(fname(f)),`<button class="link" data-act="rView" data-v="pick" style="align-self:flex-start">${t('back')}</button>
     <p class="note" style="margin:0">${per100(f)} ${badge(f.src)}</p>
     ${qtyBlock(f.pg||100,f.pg?{pl:fpl(f),pg:f.pg}:null,null)}<button class="btn" data-act="rAddIng">${t('addToRecipe')}</button>`);liveUpd(f);return}
  sheetShell(A.isNew?t('newRecipe'):t('editRecipe'),`<label class="f">${t('name')}<input id="rN" placeholder="${t('recipePh')}" value="${esc(r.n)}"></label>
   <div class="grid2"><label class="f">${t('nParts')}<input id="rParts" type="number" inputmode="numeric" min="1" value="${r.parts}"></label>
   <label class="f">${t('cookedTotal')}<input id="rCooked" type="number" inputmode="decimal" placeholder="${t('optional')}" value="${r.cooked||''}"></label></div>
   <p class="note" style="margin:-4px 0 0">${t('cookedTip')} ${t('partsHint')}</p>
   <p class="lbl grp">${t('ingsRaw')}</p>
   <div id="ings" style="display:flex;flex-direction:column;gap:8px">${r.ings.length?r.ings.map(ingHTML).join(''):`<p class="note" style="margin:0">${t('noIng')}</p>`}</div>
   <button class="btn ghost" data-act="rView" data-v="pick">${t('plusIng')}</button>
   <div class="totbox" id="rTot">${totHTML(r)}</div>
   <button class="btn" data-act="rSave">${t('saveRecipe')}</button>${A.isNew?'':`<button class="btn danger" data-act="rDel">${t('deleteRecipe')}</button>`}`)}
function readRecipeForm(){if(A.rview!=='edit'||!$('#rN'))return;const r=A.rec;r.n=$('#rN').value.trim();r.parts=Math.max(1,Math.round(+$('#rParts').value||1));r.cooked=+$('#rCooked').value>0?+$('#rCooked').value:''}

function pushRecent(id){P.recents=[id,...P.recents.filter(x=>x!==id)].slice(0,15)}
async function addEntries(list){const day=await getDay(cur);day.entries.push(...list);saveDay(cur);saveP();closeSheet();render()}
const curMeal=()=>{const h=new Date().getHours();return h<10?'pdj':h<15?'dej':h<18?'col':'din'};
const XK=['su','lg','fi','ags','sel'];
const snap=f=>{const o={kc:f.kc,pr:f.pr,gl:f.gl,li:f.li};XK.forEach(k=>o[k]=f[k]==null?null:f[k]);return o};

/* ---------- Événements ---------- */
document.addEventListener('click',async e=>{
  if(e.target.id==='ov'){if(!(A&&A.rec))closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  if(a==='tab'){tab=d.v;await render();scrollTo(0,0)}
  else if(a==='lang')setLang(d.v);
  else if(a==='cvMode'){CV.mode=d.v;render()}
  else if(a==='cvPick'){CV.food=findFood(d.id);CV.q='';CV.ckFood=autoCooked(CV.food);CV.ckAuto=!!CV.ckFood;CV.q2=null;$('#cvFood').innerHTML=cvFoodHTML();$('#cvCk').innerHTML=cvCookedHTML();$('#cvOut').innerHTML=cvOutHTML()}
  else if(a==='cvPick2'){CV.ckFood=findFood(d.id);CV.ckAuto=false;$('#cvCk').innerHTML=cvCookedHTML();$('#cvOut').innerHTML=cvOutHTML()}
  else if(a==='cvClear2'){CV.ckFood=null;$('#cvCk').innerHTML=cvCookedHTML();$('#cvOut').innerHTML=cvOutHTML()}
  else if(a==='cvClear'){CV.food=null;CV.ckFood=null;CV.q2=null;$('#cvCk').innerHTML='';$('#cvFood').innerHTML=cvFoodHTML();$('#cvOut').innerHTML=cvOutHTML();const q=$('#cvQ');q&&q.focus()}
  else if(a==='cvSave'){const f=CV.food,raw=+CV.raw,R=cvRatio();if(!f||!R)return;const ck=Math.round(R.ck);const n=CV.mode==='boxes'?Math.max(1,Math.round(+CV.n||1)):Math.max(1,Math.round(raw/(+CV.rawPer||raw)));
    P.recipes.unshift({id:'r'+uid6(),n:t('cvPrep',{n:fname(f)})+(R.approx?t('cvEstShort'):''),parts:n,cooked:ck,ings:[{id:uid6(),n:f.n,g:raw,fid:f.id,src:f.src,b:snap(f)}]});keepOff(f);saveP();render();toast(t('cvSaved'))}
  else if(a==='day'){cur=addDays(cur,+d.d);render()}
  else if(a==='today'){cur=today();render()}
  else if(a==='add'){A={meal:d.meal,view:'search',q:''};openSheet()}
  else if(a==='close')closeSheet();
  else if(a==='view'){if(A.view==='create')readCreateForm();A.view=d.v;A.cam=false;if(d.v==='create'&&!A.newCode)A.pre=A.pre&&!A.pre.code?A.pre:{};if(d.v!=='create'){A.newCode=false;if(A.pre&&A.pre.code)A.pre=null}renderSheet()}
  else if(a==='pick'){A.food=findFood(d.id);A.view='detail';renderSheet()}
  else if(a==='fav'){keepOff(OFFMEM[d.id]);P.favs=P.favs.includes(d.id)?P.favs.filter(x=>x!==d.id):[d.id,...P.favs];saveP();const fl=$('#flist');if(fl)fl.innerHTML=A.rec?foodListHTML('rPick',A.rec.id):foodListHTML();else renderSheet()}
  else if(a==='chip'){$('#qty').value=r1(+d.g);liveUpd(A.editId?days[cur].entries.find(x=>x.id===A.editId).b:A.food)}
  else if(a==='confirmAdd'){const f=A.food,g=+$('#qty').value;if(!(g>0)){toast(t('tQty'));return}
    keepOff(f);pushRecent(f.id);const meal=$('#mealSel').value;await addEntries([{id:uid6(),meal,n:f.n,g,fid:f.id,src:f.src,pl:f.pl,pg:f.pg,b:snap(f)}]);toast(t('tAdded',{meal:lc1(mealName(meal))}))}
  else if(a==='edit'){A={editId:d.id};openSheet()}
  else if(a==='saveEdit'){const en=days[cur].entries.find(x=>x.id===A.editId),g=+$('#qty').value;if(!(g>0)){toast(t('tQty'));return}
    en.g=g;en.meal=$('#mealSel').value;saveDay(cur);closeSheet();render()}
  else if(a==='delEntry'){const day=days[cur];day.entries=day.entries.filter(x=>x.id!==A.editId);saveDay(cur);closeSheet();render();toast(t('tDeleted'))}
  else if(a==='copy'){const prev=await getDay(addDays(cur,-1)),day=await getDay(cur);
    day.entries.push(...prev.entries.filter(x=>x.meal===d.meal).map(x=>({...JSON.parse(JSON.stringify(x)),id:uid6()})));saveDay(cur);render();toast(t('tCopied'))}
  else if(a==='eau'){const day=await getDay(cur),i=+d.i;day.eau=day.eau===i+1?i:i+1;saveDay(cur);render()}
  else if(a==='codeGo'){lookupCode(($('#codeIn').value||'').replace(/\D/g,''))}
  else if(a==='camGo'){A.cam=true;A.scanMsg='';renderSheet()}
  else if(a==='camStop'){A.cam=false;renderSheet()}
  else if(a==='offGo')runOffSearch();
  else if(a==='exp')exportData();
  else if(a==='impOk')doImport();
  else if(a==='impNo'){impData=null;render()}
  else if(a==='createSave'){readCreateForm();const p=A.pre,n=p.n.trim(),kc=parseFloat(p.kc);
    if(!n||!(kc>=0)){toast(t('tNameKcal'));return}
    const f={id:'c'+uid6(),n,kc,pr:parseFloat(p.pr)||0,gl:parseFloat(p.gl)||0,li:parseFloat(p.li)||0,...Object.fromEntries(['su','ags','fi','sel'].map(k=>[k,p[k]!==''&&p[k]!=null&&!isNaN(parseFloat(p[k]))?parseFloat(p[k]):null])),lg:null,pl:(p.pl||'').trim(),pg:parseFloat(p.pg)||0,cat:'Mes produits',src:'etiquette'};
    if(p.code)f.code=p.code;if(!f.pg)f.pl='';else if(!f.pl)f.pl=t('serving');
    if(f.code)P.custom=P.custom.filter(x=>x.code!==f.code);P.custom.push(f);saveP();A.food=f;A.view='detail';A.newCode=false;A.pre=null;renderSheet();toast(t('tProdSaved'))}
  else if(a==='recNew'){A={rec:{id:'r'+uid6(),n:'',parts:4,cooked:'',ings:[]},rview:'edit',q:'',isNew:true};openSheet()}
  else if(a==='recEdit'){const r=P.recipes.find(x=>x.id===d.id);if(!r)return;A={rec:JSON.parse(JSON.stringify(r)),rview:'edit',q:''};openSheet()}
  else if(a==='recAdd'){const f=findFood(d.id);if(!f)return;A={meal:cur===today()?curMeal():'dej',view:'detail',q:'',food:f};openSheet()}
  else if(a==='rView'){readRecipeForm();A.rview=d.v;A.q='';renderSheet()}
  else if(a==='rPick'){A.food=findFood(d.id);A.rview='qty';renderSheet()}
  else if(a==='rAddIng'){const f=A.food,g=+$('#qty').value;if(!(g>0)){toast(t('tQty'));return}
    keepOff(f);A.rec.ings.push({id:uid6(),n:f.n,g,fid:f.id,src:f.src,b:snap(f)});pushRecent(f.id);A.rview='edit';renderSheet()}
  else if(a==='rDelIng'){readRecipeForm();A.rec.ings.splice(+d.i,1);renderSheet()}
  else if(a==='rSave'){readRecipeForm();const r=A.rec;if(!r.n){toast(t('tRecipeName'));return}if(!r.ings.length){toast(t('tRecipeIng'));return}
    const i=P.recipes.findIndex(x=>x.id===r.id);if(i>=0)P.recipes[i]=r;else P.recipes.unshift(r);saveP();closeSheet();render();toast(t('tRecipeSaved'))}
  else if(a==='rDel'){if(!A.confirmDel){A.confirmDel=true;b.textContent=t('confirmDelete');return}
    P.recipes=P.recipes.filter(x=>x.id!==A.rec.id);P.favs=P.favs.filter(x=>x!==A.rec.id);saveP();closeSheet();render();toast(t('tRecipeDel'))}
  else if(a==='saveProfile'){const p=P.profile,num=(id,mn,mx)=>{const v=+$(id).value;return v>=mn&&v<=mx?v:null};
    const age=num('#pAge',14,100),poids=num('#pPoids',30,300),taille=num('#pTaille',120,230);
    if(age===null||poids===null||taille===null){toast(t('tCheckProfile'));return}
    Object.assign(p,formProfile(),{saved:true});
    saveP();render();toast(t('tProfileSaved'))}
  else if(a==='addW'){const kg=+$('#wkg').value;if(!(kg>=20&&kg<=300)){toast(t('tWeightBad'));return}
    const td=today();P.weights=P.weights.filter(w=>w.d!==td);P.weights.push({d:td,kg:r1(kg)});P.profile.poids=r1(kg);justWeighed=true;saveP();render();toast(t('tWeightSaved'))}
  else if(a==='delW'){P.weights=P.weights.filter(w=>w.d!==d.d);saveP();render()}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='q'){A.q=el.value;$('#flist').innerHTML=A.rec?foodListHTML('rPick',A.rec.id):foodListHTML()}
  else if(el.id==='cvQ'){CV.q=el.value;const box=$('#cvFood');const pos=el.selectionStart;box.innerHTML=cvFoodHTML();const q=$('#cvQ');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  else if(['cvRaw','cvCooked','cvN','cvRawPer'].includes(el.id)){CV[{cvRaw:'raw',cvCooked:'cooked',cvN:'n',cvRawPer:'rawPer'}[el.id]]=el.value;if(el.id==='cvCooked'||el.id==='cvRaw')$('#cvCk').innerHTML=cvCookedHTML();$('#cvOut').innerHTML=cvOutHTML()}
  else if(el.id==='cvQ2'){CV.q2=el.value;const pos=el.selectionStart;$('#cvCk').innerHTML=cvCookedHTML();const q=$('#cvQ2');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
  else if(el.id==='qty')liveUpd(A.editId?days[cur].entries.find(x=>x.id===A.editId).b:A.food);
  else if(['pSexe','pAge','pPoids','pTaille','pAct','pObj','pPerso','pEau'].includes(el.id))profileUpd();
  else if(['cK','cP','cG','cL'].includes(el.id))chkUpd();
  else if(['rParts','rCooked','rN'].includes(el.id)){readRecipeForm();$('#rTot').innerHTML=totHTML(A.rec)}
  else if(el.dataset.rig!==undefined){const x=A.rec.ings[+el.dataset.rig];x.g=+el.value||0;$(`[data-ik="${el.dataset.rig}"]`).textContent=nf(x.b.kc*x.g/100)+' kcal';$('#rTot').innerHTML=totHTML(A.rec)}});
document.addEventListener('change',e=>{const el=e.target,f=el.files&&el.files[0];
  if((el.id==='scanCam'||el.id==='scanFile')&&f)scanFile(f);
  else if(el.id==='impFile'&&f)readImport(f);
  else if(['pSexe','pAct','pObj'].includes(el.id))profileUpd()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'&&A&&A.q.trim().length>1){e.preventDefault();runOffSearch()}if(e.key==='Enter'&&e.target.id==='codeIn'){e.preventDefault();lookupCode((e.target.value||'').replace(/\D/g,''))}if(e.key==='Escape'&&!$('#ov').hidden&&!(A&&A.rec))closeSheet()});

/* ---------- Sauvegarde ---------- */
let impData=null;
function exportData(){const out={app:'CalTrack',version:1,date:new Date().toISOString(),data:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS))out.data[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k))}}catch(e){toast(t('tReadFail'));return}
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`${t('backupFile')}-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(t('tBackup'))}
async function readImport(file){try{const j=JSON.parse(await file.text());if(!j||j.app!=='CalTrack'||!j.data)throw 0;impData={name:file.name,n:Object.keys(j.data).length,data:j.data};render()}
  catch(e){toast(t('tNotBackup'))}}
async function doImport(){if(!impData)return;try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS))keys.push(k)}keys.forEach(k=>localStorage.removeItem(k));
  for(const[k,v]of Object.entries(impData.data))localStorage.setItem(LS+k,typeof v==='string'?v:JSON.stringify(v))}catch(e){toast(t('tRestoreFail'));return}
  impData=null;const l=lget('lang');if(l==='fr'||l==='en'){LANG=l;LOC=l==='fr'?'fr-FR':'en-GB';applyStatic()}await loadAll();render();toast(t('tRestored'))}

/* ---------- Démarrage ---------- */
applyStatic();
(async()=>{await loadAll();render()})();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
